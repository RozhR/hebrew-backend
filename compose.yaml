name: hebrew-learning

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hebrew_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hebrew_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ../hebrew-redux-toolkit
    image: hebrew-frontend:local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  backend:
    build: .
    image: hebrew-backend:local
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hebrew_learning
      DB_USER: postgres
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD}
      JWT_SECRET: ${DOCKER_JWT_SECRET:?Set DOCKER_JWT_SECRET}
      JWT_EXPIRES_IN: 1h
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true

volumes:
  postgres-data: