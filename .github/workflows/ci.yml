name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            NODE_ENV: test
            DB_HOST: 127.0.0.1
            DB_PORT: "5432"
            DB_NAME: hebrew_learning_test
            DB_USER: postgres
            DB_PASSWORD: ci-test-password
            JWT_SECRET: ci-only-secret-for-hebrew-learning-integration-tests

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: hebrew_learning_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ci-test-password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d hebrew_learning_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Create test database schema
              run: npm run db:schema

            - name: Run tests
              run: npm test -- --runInBand

            - name: Audit production dependencies
              run: npm audit --omit=dev
